# FriendBet Prometheus Monitoring Rules
# Defines alerting rules for FriendBet application monitoring

---
# PrometheusRule for FriendBet alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: friendbet
  namespace: friendbet
  labels:
    app: friendbet
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: friendbet.rules
    interval: 30s
    rules:
    # Alert if FriendBet pods are not ready
    - alert: FriendBetPodsNotReady
      expr: |
        kube_deployment_status_replicas_ready{namespace="friendbet", deployment="friendbet"} 
        < 
        kube_deployment_spec_replicas{namespace="friendbet", deployment="friendbet"}
      for: 5m
      labels:
        severity: warning
        app: friendbet
      annotations:
        summary: "FriendBet pods are not ready"
        description: "Only {{ $value }} out of {{ $value }} replicas are ready for FriendBet deployment"

    # Alert if FriendBet is down
    - alert: FriendBetDown
      expr: |
        up{namespace="friendbet", job="friendbet"} == 0
      for: 5m
      labels:
        severity: critical
        app: friendbet
      annotations:
        summary: "FriendBet is down"
        description: "FriendBet has been down for more than 5 minutes"

    # Alert on high memory usage
    - alert: FriendBetHighMemoryUsage
      expr: |
        container_memory_usage_bytes{namespace="friendbet", container="pocketbase"} 
        / 
        container_spec_memory_limit_bytes{namespace="friendbet", container="pocketbase"} 
        > 0.9
      for: 10m
      labels:
        severity: warning
        app: friendbet
      annotations:
        summary: "FriendBet high memory usage"
        description: "FriendBet memory usage is above 90% for 10 minutes"

    # Alert on high CPU usage
    - alert: FriendBetHighCPUUsage
      expr: |
        rate(container_cpu_usage_seconds_total{namespace="friendbet", container="pocketbase"}[5m]) 
        > 0.8
      for: 10m
      labels:
        severity: warning
        app: friendbet
      annotations:
        summary: "FriendBet high CPU usage"
        description: "FriendBet CPU usage is above 80% for 10 minutes"

    # Alert on pod restarts
    - alert: FriendBetPodRestarting
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="friendbet", pod=~"friendbet-.*"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
        app: friendbet
      annotations:
        summary: "FriendBet pod is restarting"
        description: "FriendBet pod {{ $labels.pod }} is restarting frequently"

    # Alert on PVC space usage
    - alert: FriendBetPVCFillingUp
      expr: |
        kubelet_volume_stats_used_bytes{namespace="friendbet", persistentvolumeclaim=~"friendbet.*"} 
        / 
        kubelet_volume_stats_capacity_bytes{namespace="friendbet", persistentvolumeclaim=~"friendbet.*"} 
        > 0.85
      for: 10m
      labels:
        severity: warning
        app: friendbet
      annotations:
        summary: "FriendBet PVC is filling up"
        description: "FriendBet PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

    # Alert on backup failures
    - alert: FriendBetBackupFailed
      expr: |
        kube_job_status_failed{namespace="friendbet", job_name=~"friendbet-backup.*"} > 0
      for: 0m
      labels:
        severity: critical
        app: friendbet
      annotations:
        summary: "FriendBet backup failed"
        description: "FriendBet backup job {{ $labels.job_name }} has failed"

    # Alert on Cloudflare tunnel down
    - alert: FriendBetCloudflareTunnelDown
      expr: |
        up{namespace="friendbet", job="cloudflare-tunnel"} == 0
      for: 5m
      labels:
        severity: critical
        app: friendbet
      annotations:
        summary: "FriendBet Cloudflare tunnel is down"
        description: "Cloudflare tunnel for FriendBet has been down for more than 5 minutes"

  - name: friendbet.recording.rules
    interval: 30s
    rules:
    # Recording rule for request rate
    - record: friendbet:request_rate
      expr: |
        rate(http_requests_total{namespace="friendbet", job="friendbet"}[5m])

    # Recording rule for error rate
    - record: friendbet:error_rate
      expr: |
        rate(http_requests_total{namespace="friendbet", job="friendbet", status=~"5.."}[5m])

    # Recording rule for memory usage percentage
    - record: friendbet:memory_usage_percentage
      expr: |
        container_memory_usage_bytes{namespace="friendbet", container="pocketbase"} 
        / 
        container_spec_memory_limit_bytes{namespace="friendbet", container="pocketbase"} 
        * 100

    # Recording rule for CPU usage percentage
    - record: friendbet:cpu_usage_percentage
      expr: |
        rate(container_cpu_usage_seconds_total{namespace="friendbet", container="pocketbase"}[5m]) 
        * 100
