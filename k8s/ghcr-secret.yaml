# IMPORTANT: Create a GitHub Personal Access Token with `read:packages` and `write:packages` scopes
# Then run: kubectl create secret docker-registry ghcr-auth \
#   --docker-server=ghcr.io \
#   --docker-username=barakplasma \
#   --docker-password=YOUR_GITHUB_TOKEN \
#   --namespace=friendbet
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: friendbet
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"barakplasma","password":"YOUR_GITHUB_TOKEN","auth":""}}}
