# IMPORTANT: Replace the base64 encoded credentials below with your actual GitHub credentials
# To generate proper credentials:
# 1. Create a GitHub Personal Access Token with `read:packages` and `write:packages` scopes
# 2. Encode like: echo -n "username:token" | base64
# 3. Update the .dockerconfigjson field with proper credentials
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: friendbet
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: BASE64_ENCODED_DOCKER_CONFIG_JSON
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"YOUR_GITHUB_USERNAME","password":"YOUR_GITHUB_TOKEN","auth":"BASE64_ENCODED_CREDENTIALS"}}}
