apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: friendbet
type: Opaque
stringData:
  POSTGRES_DB: friendbet
  POSTGRES_USER: friendbet
  POSTGRES_PASSWORD: change-me-in-production
  POSTGRES_HOST: postgres-service
  POSTGRES_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: django-secret
  namespace: friendbet
type: Opaque
stringData:
  DJANGO_SECRET_KEY: change-me-in-production-use-openssl-rand-hex-32
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  OAUTH_GITHUB_CLIENT_ID: ""
  OAUTH_GITHUB_CLIENT_SECRET: ""