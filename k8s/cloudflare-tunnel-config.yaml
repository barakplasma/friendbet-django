# Cloudflare Tunnel Configuration for FriendBet
# This file contains the Kubernetes manifests for Cloudflare Tunnel integration
# It assumes you have cloudflared installed and configured in your cluster

---
# ConfigMap for Cloudflare Tunnel Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-friendbet
  namespace: friendbet
  labels:
    app: friendbet
    component: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: <YOUR_TUNNEL_ID>
    credentials-file: /etc/cloudflared/credentials.json
    
    metrics: 0.0.0.0:2000
    
    no-autoupdate: true
    
    ingress:
      # FriendBet main application
      - hostname: friendbet.526462738.xyz
        service: http://friendbet.friendbet.svc.cluster.local:8090
        originRequest:
          noTLSVerify: true
          connectTimeout: 30s
          tcpKeepAlive: 30s
          keepAliveConnections: 10
          keepAliveTimeout: 90s
      
      # Health check endpoint (optional, for monitoring)
      - hostname: friendbet-health.526462738.xyz
        service: http://friendbet.friendbet.svc.cluster.local:8090
        path: /api/health
        originRequest:
          noTLSVerify: true
      
      # Catch-all service to block other requests
      - service: http_status:404

---
# Secret for Cloudflare Tunnel Credentials
# You'll need to create this secret after getting your tunnel credentials
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: friendbet
  labels:
    app: friendbet
    component: cloudflare-tunnel
type: Opaque
stringData:
  # Replace with your actual tunnel credentials from Cloudflare
  # You can get this by running: cloudflared tunnel create <tunnel-name>
  credentials.json: |
    {
      "AccountTag": "<YOUR_ACCOUNT_TAG>",
      "TunnelID": "<YOUR_TUNNEL_ID>",
      "TunnelSecret": "<YOUR_TUNNEL_SECRET>"
    }

---
# Deployment for Cloudflare Tunnel Daemon
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel-friendbet
  namespace: friendbet
  labels:
    app: friendbet
    component: cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: friendbet
      component: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: friendbet
        component: cloudflare-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2024.1.0
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: credentials
          mountPath: /etc/cloudflared/credentials
          readOnly: true
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: cloudflare-tunnel-friendbet
          items:
          - key: config.yaml
            path: config.yaml
      - name: credentials
        secret:
          secretName: cloudflare-tunnel-credentials
          items:
          - key: credentials.json
            path: credentials.json
      restartPolicy: Always
      
---
# Service for Cloudflare Tunnel Metrics (optional, for monitoring)
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-tunnel-metrics
  namespace: friendbet
  labels:
    app: friendbet
    component: cloudflare-tunnel
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "2000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: friendbet
    component: cloudflare-tunnel
  ports:
  - name: metrics
    port: 2000
    targetPort: 2000
  type: ClusterIP
