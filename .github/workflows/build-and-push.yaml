name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - django-mvp
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - django-mvp
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-latest-arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    container:
      image: quay.io/buildah/stable
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up containerd for image storage
        run: |
          mkdir -p /var/lib/containers
          chmod -R 777 /var/lib/containers

      - name: Configure buildah to use containerd
        run: |
          echo "export BUILDAH_ISOLATION=chroot" >> /etc/environment
          echo "export STORAGE_DRIVER=vfs" >> /etc/environment

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Set up image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS="${IMAGE}:${{ github.sha }}"
          TAGS="${TAGS},${IMAGE}:${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build image with buildah
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          buildah bud \
            --file ./Dockerfile.build \
            --platform ${{ matrix.platform }} \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:${{ github.ref_name }}" \
            .

      - name: Push images to GHCR
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          buildah push "${IMAGE}:${{ github.sha }}"
          buildah push "${IMAGE}:${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            buildah push "${IMAGE}:latest"
          fi

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary for ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**OCI Tool:** Buildah" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ steps.tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY