name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - django-mvp
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - django-mvp
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-latest-arm64' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image with buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ github.sha }} ${{ github.ref_name }} latest
          containerfiles: ./Dockerfile.build
          platforms: ${{ matrix.platform }}
          push: true
          registry: ghcr.io
          extra-args: |
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
            --label "org.opencontainers.image.revision=${{ github.sha }}"

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary for ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**OCI Tool:** Buildah (Red Hat Actions)" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** ${{ github.sha }}, ${{ github.ref_name }}, latest" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Digest:** ${{ steps.build-image.outputs.digest }}" >> $GITHUB_STEP_SUMMARY