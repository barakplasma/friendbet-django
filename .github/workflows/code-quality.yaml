name: Code Quality

on:
  push:
    branches:
      - main
      - django-mvp
  pull_request:
    branches:
      - main
      - django-mvp
  workflow_dispatch:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run Qlty analysis
        uses: qltysh/qlty-action@v1
        with:
          version: latest
          token: ${{ secrets.GITHUB_TOKEN }}