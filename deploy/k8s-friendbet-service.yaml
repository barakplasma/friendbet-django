# Kubernetes Service and Ingress for FriendBet via Cloudflare Access
# This connects your existing Cloudflare Tunnel to the VPS-hosted PocketBase server

# ExternalName Service - Points to VPS where PocketBase is running
apiVersion: v1
kind: Service
metadata:
  name: friendbet
  namespace: default
  labels:
    app: friendbet
    env: production
spec:
  type: ExternalName
  externalName: "YOUR-VPS-IP-OR-HOSTNAME"  # UPDATE THIS: Your VPS IP address or hostname
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  sessionAffinity: None

---
# Ingress - Connects Cloudflare Tunnel to FriendBet service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: friendbet-ingress
  namespace: default
  annotations:
    # Cloudflare Tunnel annotations
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Optional: Cloudflare Access annotations
    # cloudflare_access_auth: "true"
    # cloudflare_access_team: "your-team-name"
  labels:
    app: friendbet
    env: production
spec:
  ingressClassName: traefik  # Your Traefik ingress controller
  rules:
  - host: friendbet.yourdomain.com  # UPDATE THIS: Your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: friendbet
            port:
              number: 8090
  # TLS configuration (handled by Cloudflare)
  - tls:
     - hosts:
       - friendbet.yourdomain.com  # UPDATE THIS
       secretName: friendbet-tls  # Optional: Cloudflare handles TLS automatically