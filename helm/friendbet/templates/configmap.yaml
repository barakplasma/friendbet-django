apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "friendbet.fullname" . }}-config
  labels:
    {{- include "friendbet.labels" . | nindent 4 }}
data:
  # PocketBase configuration
  POCKETBASE_LOG_LEVEL: {{ .Values.pocketbase.logLevel | quote }}
  POCKETBASE_DATA_DIR: "/pb_data"
  
  # OAuth configuration
  POCKETBASE_OAUTH_ENABLED: {{ .Values.pocketbase.oauth.enabled | quote }}
  {{- if .Values.pocketbase.oauth.providers }}
  POCKETBASE_OAUTH_PROVIDERS: {{ .Values.pocketbase.oauth.providers | join "," | quote }}
  {{- end }}
