{{- if .Values.pocketbase.admin.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "friendbet.fullname" . }}-admin
  labels:
    {{- include "friendbet.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-email: {{ .Values.pocketbase.admin.email | quote }}
  admin-password: {{ .Values.pocketbase.admin.password | quote }}
{{- end }}

{{- if .Values.backup.s3.endpoint }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "friendbet.fullname" . }}-backup
  labels:
    {{- include "friendbet.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-endpoint: {{ .Values.backup.s3.endpoint | quote }}
  s3-bucket: {{ .Values.backup.s3.bucket | quote }}
  s3-access-key: {{ .Values.backup.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.backup.s3.secretKey | quote }}
{{- end }}
