{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "friendbet.fullname" . }}-backup
  labels:\n    {{- include \"friendbet.labels\" . | nindent 4 }}
spec:
  schedule: \"{{ .Values.backup.schedule }}\"\n  successfulJobsHistoryLimit: {{ .Values.backup.retention }}\n  failedJobsHistoryLimit: 3\n  jobTemplate:\n    spec:\n      template:\n        metadata:\n          labels:\n            {{- include \"friendbet.selectorLabels\" . | nindent 12 }}\n        spec:\n          restartPolicy: OnFailure\n          serviceAccountName: {{ include \"friendbet.serviceAccountName\" . }}\n          containers:\n          - name: backup\n            image: \"{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}\"\n            command:\n            - /bin/sh\n            - -c\n            - |\n              # Backup script\n              DATE=$(date +%Y%m%d_%H%M%S)\n              BACKUP_FILE=\"/tmp/friendbet_backup_${DATE}.zip\"\n              \n              echo \"Starting backup at $(date)\"\n              \n              # Create backup using PocketBase CLI\n              ./pocketbase backup \"${BACKUP_FILE}\"\n              \n              if [ $? -eq 0 ]; then\n                echo \"Backup created successfully\"\n                \n                {{- if eq .Values.backup.destination \"pvc\" }}\n                # Copy to backup PVC location\n                cp \"${BACKUP_FILE}\" /pb_data/backups/\n                \n                # Cleanup old backups\n                find /pb_data/backups/ -name \"friendbet_backup_*.zip\" -mtime +{{ .Values.backup.retention }} -delete\n                {{- else if eq .Values.backup.destination \"s3\" }}\n                # Upload to S3\n                apk add --no-cache curl\n                \n                S3_ENDPOINT=\"${S3_ENDPOINT}\"\n                S3_BUCKET=\"${S3_BUCKET}\"\n                S3_ACCESS_KEY=\"${S3_ACCESS_KEY}\"\n                S3_SECRET_KEY=\"${S3_SECRET_KEY}\"\n                \n                curl -X PUT \\n                  \"${S3_ENDPOINT}/${S3_BUCKET}/friendbet_backup_${DATE}.zip\" \\n                  --data-binary \"@${BACKUP_FILE}\" \\n                  -H \"Authorization: Bearer ${S3_ACCESS_KEY}:${S3_SECRET_KEY}\"\n                {{- end }}\n                \n                echo \"Backup completed at $(date)\"\n              else\n                echo \"Backup failed\"\n                exit 1\n              fi\n            env:\n            - name: PB_URL\n              value: \"http://localhost:8090\"\n            - name: POCKETBASE_DATA_DIR\n              value: \"/pb_data\"\n            {{- if eq .Values.backup.destination \"s3\" }}\n            - name: S3_ENDPOINT\n              valueFrom:\n                secretKeyRef:\n                  name: {{ include \"friendbet.fullname\" . }}-backup\n                  key: s3-endpoint\n            - name: S3_BUCKET\n              valueFrom:\n                secretKeyRef:\n                  name: {{ include \"friendbet.fullname\" . }}-backup\n                  key: s3-bucket\n            - name: S3_ACCESS_KEY\n              valueFrom:\n                secretKeyRef:\n                  name: {{ include \"friendbet.fullname\" . }}-backup\n                  key: s3-access-key\n            - name: S3_SECRET_KEY\n              valueFrom:\n                secretKeyRef:\n                  name: {{ include \"friendbet.fullname\" . }}-backup\n                  key: s3-secret-key\n            {{- end }}\n            volumeMounts:\n            - name: data\n              mountPath: /pb_data\n            - name: tmp\n              mountPath: /tmp\n            resources:\n              requests:\n                cpu: 100m\n                memory: 128Mi\n              limits:\n                cpu: 500m\n                memory: 256Mi\n          volumes:\n          - name: data\n            persistentVolumeClaim:\n              claimName: {{ include \"friendbet.fullname\" . }}-data\n          - name: tmp\n            emptyDir: {}\n{{- end }}
