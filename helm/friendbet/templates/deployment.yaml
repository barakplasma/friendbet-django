apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "friendbet.fullname" . }}
  labels:
    {{- include "friendbet.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "friendbet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "friendbet.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "friendbet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: pocketbase
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8090
          protocol: TCP
        env:
        - name: PB_URL
          value: "http://localhost:8090"
        - name: POCKETBASE_DATA_DIR
          value: "/pb_data"
        - name: POCKETBASE_LOG_LEVEL
          value: {{ .Values.pocketbase.logLevel | quote }}
        {{- if .Values.pocketbase.admin.enabled }}
        - name: PB_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "friendbet.fullname" . }}-admin
              key: admin-email
        - name: PB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "friendbet.fullname" . }}-admin
              key: admin-password
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ include "friendbet.fullname" . }}-config
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 18
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /pb_data
        - name: public
          mountPath: /pb_public
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "friendbet.fullname" . }}-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: public
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}